# Model layer shared by every arm: route all model calls through the local
# pinning proxy (lab/orproxy.py). The proxy holds the real OpenRouter key and
# forces model/provider/sampling; DSH only sees a dummy key. Window and output
# cap mirror DSH's llm-deepseek defaults (1M window); output capped at 64k.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      lab:
        displayName: Lab DeepSeek V4 Flash
        apiKeyEnv: LAB_API_KEY
        api: openai-completions
        baseURL: !!js process.env.LAB_BASE_URL
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
          supportsStore: false
          supportsReasoningEffort: false
        models:
          - id: !!js process.env.LAB_MODEL_ID ?? 'deepseek-v4-flash'
            name: DeepSeek-V4-Flash
            contextWindow: !!js Number(process.env.LAB_CONTEXT_WINDOW ?? 1000000)
            maxTokens: !!js Number(process.env.LAB_MAX_TOKENS ?? 65536)
            reasoningEfforts: false
# Privacy/isolation: never upload session logs or telemetry.
- id: session-log-deepseek
  name: '@deepseek-ai/dsh-session-log-deepseek'
  config:
    enabled: false
